<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="StoXify Trader — SEBI-registered research marketplace">
  <!-- Match phone CSS width so layout can switch to the mobile shell -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="StoXify Trader">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>StoXify Trader</title>
  <link rel="manifest" href="manifest.json">

  <!-- Razorpay Standard Checkout (required for Flutter web payments) -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <!-- Kill browser default borders/outlines; keep editable text vertically centered -->
  <style>
    input,
    textarea,
    input:focus,
    textarea:focus,
    flt-text-editing-host,
    flt-text-editing-host input,
    flt-semantics input,
    flutter-view input {
      outline: none !important;
      outline-width: 0 !important;
      border: 0 !important;
      border-style: none !important;
      border-width: 0 !important;
      border-color: transparent !important;
      box-shadow: none !important;
      background: transparent !important;
      background-color: transparent !important;
      -webkit-appearance: none !important;
      appearance: none !important;
      caret-color: #2F6BFF;
      margin: 0 !important;
      padding: 0 !important;
      line-height: 1.2 !important;
      vertical-align: middle !important;
      box-sizing: border-box !important;
      height: 100% !important;
    }
    flt-text-editing-host,
    flt-semantics {
      display: flex !important;
      align-items: center !important;
      height: 100% !important;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
